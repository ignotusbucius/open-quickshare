name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name'
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "${{ github.workspace }}/app/main/src-tauri/target"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Build (Vite + Tauri) — deb, rpm, AppImage
        run: |
          cd app/main
          pnpm install
          pnpm build

      - name: Attach bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            app/main/src-tauri/target/release/bundle/deb/*.deb
            app/main/src-tauri/target/release/bundle/rpm/*.rpm
            app/main/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-quickshare-linux
          path: |
            app/main/src-tauri/target/release/bundle/deb/*.deb
            app/main/src-tauri/target/release/bundle/rpm/*.rpm
            app/main/src-tauri/target/release/bundle/appimage/*.AppImage
