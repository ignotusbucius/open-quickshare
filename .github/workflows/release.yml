name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name'
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "${{ github.workspace }}/app/main/src-tauri/target"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Build (Vite + Tauri) — deb, rpm, AppImage
        run: |
          # The Rust cache restores target/ including PREVIOUS versions'
          # bundles, and the attach step globs the whole bundle dir — stale
          # old-version assets ended up on releases twice. Start clean.
          rm -rf app/main/src-tauri/target/release/bundle
          cd app/main
          pnpm install
          pnpm build

      - name: Unbundle libwayland from the AppImage
        # linuxdeploy ships the runner's libwayland-*, but the host's Mesa
        # libEGL is loaded at runtime and needs the host's (newer) libwayland.
        # The mismatch kills WebKitWebProcess on current Fedora/Aurora with
        # "Could not create default EGL display: EGL_BAD_PARAMETER" (white
        # window). Every GTK3 desktop already has libwayland, so use the host's.
        run: |
          cd app/main/src-tauri/target/release/bundle/appimage
          img=$(ls *.AppImage)
          ./"$img" --appimage-extract >/dev/null
          rm -v squashfs-root/usr/lib/libwayland-*
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          rm "$img"
          # Name it x86_64 like the .rpm (Tauri uses Debian-style amd64).
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run squashfs-root "${img/_amd64/_x86_64}"
          rm -rf squashfs-root appimagetool-x86_64.AppImage
          ls -la
          cd ../deb && for f in *_amd64.deb; do mv -v "$f" "${f/_amd64/_x86_64}"; done

      - name: Attach bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A non-empty body stops GitHub from falling back to rendering the
          # tagged commit's full message on the releases page.
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            app/main/src-tauri/target/release/bundle/deb/*.deb
            app/main/src-tauri/target/release/bundle/rpm/*.rpm
            app/main/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-quickshare-linux
          path: |
            app/main/src-tauri/target/release/bundle/deb/*.deb
            app/main/src-tauri/target/release/bundle/rpm/*.rpm
            app/main/src-tauri/target/release/bundle/appimage/*.AppImage
